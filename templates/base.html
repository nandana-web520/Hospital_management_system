<!Doctype html>
<html lang='en'>
    <head>
        <title>Hospital Management System{% block title%}{% endblock %}</title>
        <style>
            body{
                background-color: #81c1e8;
                color: white;
                font-family:arial,sans-serif;
            }
            header{
                background-color: #090a0a;
                color: white;
                padding:15px;
                text-align: center;
            }
            container{
                width:90%;
                margin: 0 auto;
                min-height: 600px;
                max-width: 800px;
                max-height: 800px;
                padding:50px;
            }
            nav{
                background-color: #3e5555;
                color: white;
                padding:15px;
                text-align: center;
                max-height: 800px;
            }
            nav a{
                color: white;
                text-decoration: none;
                margin: 0 10px;
                max-heigth:600px;
            }
            nav a:hover{
                text-decoration: underline;
            }
            li{
                font-color:red;
            }
            footer{
                background-color: #090a0a;
                color: white;
                padding:15px;
                text-align: center;
            }
        </style>
    </head>
   < body>
        <header>
            <h1>Hospital Management System</h1>
        </header>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'patient' %}">Patients</a>
            <a href="{% url 'doctor' %}">Doctors</a>
            <a href="{% url 'appointment' %}">Appointments</a>
            <a href="{% url 'billing' %}">Billing</a>
            <a href="{% url 'department' %}">Departments</a>
        </nav>
        <container>
            {% block content %}{% endblock %}
        </container>
        <footer>
            &copy; 2026 Hospital Management System
        </footer>
